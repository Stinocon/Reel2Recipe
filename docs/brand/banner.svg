<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img"
     aria-label="Reel2Recipe — dai reel di cucina al tuo ricettario, tutto in locale">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241e1a"/>
      <stop offset="1" stop-color="#191412"/>
    </linearGradient>
    <linearGradient id="tegame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0805c"/>
      <stop offset="1" stop-color="#c05a38"/>
    </linearGradient>
    <linearGradient id="parola" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf6f0"/>
      <stop offset="1" stop-color="#e8a686"/>
    </linearGradient>
    <radialGradient id="alone1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9714e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d9714e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="alone2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a8f5f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6a8f5f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bordo">
      <rect width="1200" height="260" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#fondo)"/>
  <!-- Gli stessi aloni caldi dello sfondo dell'interfaccia, così banner e app si somigliano. -->
  <g clip-path="url(#bordo)">
    <ellipse cx="150" cy="40" rx="380" ry="260" fill="url(#alone1)"/>
    <ellipse cx="1050" cy="240" rx="420" ry="280" fill="url(#alone2)"/>
  </g>

