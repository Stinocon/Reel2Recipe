  <text x="228" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="66"
        font-weight="700" fill="url(#parola)" letter-spacing="-0.5">Reel2Recipe</text>
  <text x="231" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" fill="#a89a8c">Dai reel di cucina al tuo ricettario</text>

  <g transform="translate(231 174)">
    <rect width="560" height="32" rx="16" fill="#2f2723" stroke="#4a3d34"/>
    <circle cx="19" cy="16" r="4.5" fill="#6a8f5f"/>
    <text x="34" y="21" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
