# vague.yaml — the kitchen's "by eye" measures, in Italian and in English.
#
# "q.b.", "un pizzico", "un filo d'olio", "una noce di burro" are not units of measurement:
# they are conventions of language. They have no exact value, but they do have a *typical*
# one, and ignoring them would mean throwing away half a reel's ingredients.
#
# Every entry in here produces a quantity with provenance `estimated:vague`, which the interface
# and the exports flag as an estimate. They are never presented as certain data: they are a
# help, not a measurement.
#
# The **keys** are English; the expressions and their aliases are not, and cannot be: they are
# the words the captions are written in, and they are what the lookup matches against.
#
# `without_quantity: true` means the expression does not express a quantity at all ("q.b."):
# in that case nothing is estimated, the wording is kept.
#
# ---------------------------------------------------------------------------------
# WHY THE NOTE IS NOT IN THE TABLE
#
# The note explaining the estimate ("un pizzico ≈ 0,5 g") is not written here: it is composed
# from the actual value. Written by hand it would depend on the language, while the number
# depends on the system — and the two diverge: in metric/English you got "0,5 g (a pinch is
# about 1/8 tsp)", a note contradicting the number it accompanies. What stays here is only the
# expression's name per language, which is the only part that cannot be deduced.
#
# WHY THE VALUE IS DECLARED PER SYSTEM
#
# A pinch in grams is 0.5; converting it mechanically into ounces would give 0.018 oz, which is
# not a measure anybody carries out. In English a pinch is written "1/8 tsp", and that is the
# right datum — not the result of a division. So the typical value is declared for each system,
# as is done for the densities: the number is in the table, not in a calculation that ruins it.
#
# updated: 2026-07-24

expressions:

  # ---- these express no quantity at all -------------------------------------
  "q.b.":
    without_quantity: true
    rendering:
      it: "q.b."
      en: "to taste"
    alias: [qb, "q b", quanto basta, a piacere, a piacimento, to taste, as needed]
  "quanto serve":
    without_quantity: true
    rendering:
      it: "q.b."
      en: "as needed"
    alias: [al bisogno, se necessario, as required]

  # ---- small amounts of seasoning -------------------------------------------
  "un pizzico":
    name:
      it: "un pizzico"
      en: "a pinch"
    value:
      metric: {quantity: 0.5, unit: g}
      imperial: {quantity: 0.125, unit: tsp}
    alias: [pizzico, un pizzico di, a pinch, pinch]
  "una presa":
    name:
      it: "una presa"
      en: "a pinch"
    value:
      metric: {quantity: 1.0, unit: g}
      imperial: {quantity: 0.25, unit: tsp}
    alias: [presa, una presa di]
  "una punta":
    name:
      it: "una punta"
      en: "a knife tip"
    value:
      metric: {quantity: 0.5, unit: g}
      imperial: {quantity: 0.125, unit: tsp}
    alias: [punta di coltello, una punta di, knife tip]

  # ---- fats and liquids poured by eye ---------------------------------------
  "un filo":
    name:
      it: "un filo"
      en: "a drizzle"
    value:
      metric: {quantity: 5.0, unit: ml}
      imperial: {quantity: 1.0, unit: tsp}
    alias: [filo, un filo di, un giro, un giro di, a drizzle, drizzle]
  "una noce":
    name:
      it: "una noce"
      en: "a knob"
    value:
      metric: {quantity: 10.0, unit: g}
      imperial: {quantity: 2.0, unit: tsp}
    alias: [noce, una noce di, noce di burro, a knob, knob of butter]
  "un bicchiere":
    name:
      it: "un bicchiere"
      en: "a glass"
    value:
      metric: {quantity: 200.0, unit: ml}
      imperial: {quantity: 0.75, unit: cup}
    alias: [bicchiere, un bicchiere di, bicchiere d'acqua, a glass, glass]
  "mezzo bicchiere":
    name:
      it: "mezzo bicchiere"
      en: "half a glass"
    value:
      metric: {quantity: 100.0, unit: ml}
      imperial: {quantity: 0.375, unit: cup}
    alias: [mezzo bicchiere di, half a glass]
  "una tazza":
    name:
      it: "una tazza"
      en: "a mug"
    value:
      metric: {quantity: 240.0, unit: ml}
      imperial: {quantity: 1.0, unit: cup}
    alias: [tazza, una tazza di, tazzina, a mug, mug]

  # ---- quantities by the handful ---------------------------------------------
  "una manciata":
    name:
      it: "una manciata"
      en: "a handful"
    value:
      metric: {quantity: 30.0, unit: g}
      imperial: {quantity: 0.25, unit: cup}
    alias: [manciata, una manciata di, a handful, handful]
  "un mazzetto":
    name:
      it: "un mazzetto"
      en: "a bunch"
    value:
      metric: {quantity: 20.0, unit: g}
      imperial: {quantity: 0.75, unit: oz}
    alias: [mazzetto, un mazzetto di, un ciuffo, ciuffo, un mazzo, a bunch, bunch]

  # ---- counted pieces --------------------------------------------------------
  "uno spicchio":
    name:
      it: "uno spicchio"
      en: "a clove"
    value:
      metric: {quantity: 5.0, unit: g}
      imperial: {quantity: 1.0, unit: tsp}
    alias: [spicchio, uno spicchio di, clove, a clove]
  "una fetta":
    name:
      it: "una fetta"
      en: "a slice"
    value:
      metric: {quantity: 25.0, unit: g}
      imperial: {quantity: 1.0, unit: oz}
    alias: [fetta, una fetta di, slice, a slice]

  # ---- counting multipliers (they produce no weight) -------------------------
  # They become a pure number applied to the unit that follows, or to the count of pieces.
  "un paio":
    multiplier: 2
    alias: [paio, un paio di, a couple, a couple of]
  "una dozzina":
    multiplier: 12
    alias: [dozzina, una dozzina di, dozen, a dozen]

# Expressions denoting a genuinely open-ended quantity: nothing is estimated, the gap is
# declared and the text is kept.
indeterminate:
  - qualche
  - alcuni
  - alcune
  - un po'
  - un po
  - poco
  - poca
  - abbondante
  - a volonta
  - circa
  - vari
  - varie
  - some
  - a few
  - several
  - plenty
  - about
  - roughly
