# densita.yaml — density per ingredient, for converting a VOLUME into a WEIGHT.
#
# Why this file exists. "1 cup di farina" and "1 cup di zucchero" occupy the same volume but
# weigh 120 g and 200 g: a difference of 67%. No volume→weight conversion is possible without
# knowing *what* is being measured. An LLM asked to convert produces a plausible and often
# wrong number; here the number comes from a table.
#
# NON-NEGOTIABLE RULE: if an ingredient is not in this table, the volume→weight conversion is
# NOT done. The original unit is kept and the gap is declared. There is no "average density" to
# fall back on — that would be an invention.
#
# The **keys are English, the ingredient names are not**: they are what the model writes and
# what the cook reads, and the lookup matches against them. `g_per_ml` is the only operative
# value. The weight per cup quoted in `source` is the documentation it derives from:
# g_per_ml = g_per_cup / 236.5882365 (the US cup, in unita.yaml). It is not read by the code:
# one datum, one place.
#
# The values for dry ingredients are for the ingredient poured and levelled, not packed, unless
# noted. They are intrinsically variable quantities (±5–10% depending on humidity and
# compaction): fine for cooking, not for analytical chemistry.
#
# ---------------------------------------------------------------------------------
# THE SOURCES
#
# Every density has to cite a reference the reader can go and check: a number without a
# provenance is a number you cannot trust. The test `test_every_density_cites_a_named_source`
# verifies it, and does not accept a source that merely repeats the number.
#
#   USDA FDC <id>   FoodData Central, SR Legacy dataset. The ID identifies the food:
#                   https://fdc.nal.usda.gov/food-details/<id>
#   King Arthur     Ingredient Weight Chart, the standard baking reference:
#                   https://www.kingarthurbaking.com/learn/ingredient-weight-chart
#   definizione:    for water only: 1 ml = 1 g is not a measurement, it is the definition.
#                   (The marker stays Italian: it is matched literally by the test.)
#
# The two sources do not always agree, and where they diverge the choice is declared in the
# entry. The known cases: farina 00 (King Arthur 120 g/cup, USDA 125), farina integrale (113
# against 120), zucchero di canna (213 against 220), avena (King Arthur 113, USDA 81). Where
# the value in use matches one of the two, that is the one cited — it is its real provenance.
#
# ---------------------------------------------------------------------------------
# HOW TO ADD AN ENTRY
#
# `units.py` resolves a name by looking for the longest entry contained in it, and at equal
# length the choice is arbitrary. So every compound that can be formed has to be written out in
# full: without a `latte di cocco` entry, that name would pick at random between `latte` and
# `cocco`. The same holds for the English aliases (`coconut milk` next to `milk`). The test
# `test_every_entry_resolves_to_itself` does not let an unreachable entry through.
#
# updated: 2026-07-24

