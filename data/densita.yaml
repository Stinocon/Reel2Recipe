# densita.yaml — densità per ingrediente, per convertire un VOLUME in un PESO.
#
# Perché questo file esiste. "1 cup di farina" e "1 cup di zucchero" occupano lo stesso
# volume ma pesano 120 g e 200 g: una differenza del 67%. Nessuna conversione volume→peso
# è possibile senza sapere *cosa* si sta misurando. Un LLM a cui si chiede di convertire
# produce un numero plausibile e spesso sbagliato; qui il numero viene da una tabella.
#
# REGOLA NON NEGOZIABILE: se un ingrediente non è in questa tabella, la conversione
# volume→peso NON si fa. Si conserva l'unità originale e si dichiara la lacuna.
# Non esiste una "densità media" da usare come ripiego — sarebbe un'invenzione.
#
# `g_per_ml` è l'unico valore operativo. Il peso per cup citato in `source` è la
# documentazione da cui deriva: g_per_ml = g_per_cup / 236,5882365 (la cup US, in
# unita.yaml). Non viene letto dal codice: un solo dato, un solo posto.
#
# I valori dei secchi sono per ingrediente versato e livellato, non pressato, salvo nota.
# Sono grandezze intrinsecamente variabili (±5-10% a seconda di umidità e compattazione):
# vanno bene per cucinare, non per la chimica analitica.
#
# ---------------------------------------------------------------------------------
# LE FONTI
#
# Ogni densità deve citare un riferimento che chi legge possa andare a controllare: un
# numero senza provenienza è un numero di cui non ci si può fidare. Il test
# `test_ogni_densita_cita_una_fonte_nominata` lo verifica, e non accetta una fonte che si
# limiti a ripetere il numero.
#
#   USDA FDC <id>   FoodData Central, dataset SR Legacy. L'ID identifica l'alimento:
#                   https://fdc.nal.usda.gov/food-details/<id>
#   King Arthur     Ingredient Weight Chart, riferimento standard della panificazione:
#                   https://www.kingarthurbaking.com/learn/ingredient-weight-chart
#   definizione:    solo per l'acqua: 1 ml = 1 g non è una misura, è la definizione.
#
# Le due fonti non sempre concordano, e dove diverge la scelta è dichiarata nella voce.
# I casi noti: farina 00 (King Arthur 120 g/cup, USDA 125), farina integrale (113 contro
# 120), zucchero di canna (213 contro 220), avena (King Arthur 113, USDA 81). Dove il
# valore in uso coincide con una delle due, si cita quella — è la sua provenienza reale.
#
# ---------------------------------------------------------------------------------
# COME SI AGGIUNGE UNA VOCE
#
# `units.py` risolve un nome cercando la voce più lunga contenuta nel nome, e a parità di
# lunghezza la scelta è arbitraria. Quindi ogni composto formabile va scritto per esteso:
# senza una voce `latte di cocco`, quel nome pescherebbe a caso fra `latte` e `cocco`.
# Vale anche per gli alias inglesi (`coconut milk` accanto a `milk`). Il test
# `test_ogni_voce_risolve_a_se_stessa` non lascia passare una voce irraggiungibile.
#
# aggiornato: 2026-07-24

