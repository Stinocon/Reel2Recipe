# ---------------------------------------------------------------------------------
# Group headings
# ---------------------------------------------------------------------------------
#
# The labels a recipe divides its ingredients under. Not ingredients, but the same kind of
# fact — a word with one right translation — and the last thing the measurement showed the
# model getting wrong: "Sauce" came back as "Salsa" and "Garnish" stayed English, on the same
# card, so one recipe ended up half in each language.
#
# Only the whole heading is matched, and deliberately so. "Per la crema al limone" is mostly
# free text and belongs to the model; pattern-matching "Per la ..." would be a translation
# engine, which is the thing this file exists not to be.

groups:
  base:
    it: Per la base
    en: For the base
    alias: [base, la base, the base]
  crema:
    it: Per la crema
    en: For the cream
    alias: [crema, cream]
  copertura:
    it: Per la copertura
    en: For the topping
    alias: [copertura, topping, for the coating, coating]
  salsa:
    it: Per la salsa
    en: For the sauce
    alias: [salsa, sauce, sugo]
  condimento:
    it: Per il condimento
    en: For the dressing
    alias: [condimento, dressing, seasoning]
  guarnizione:
    it: Per guarnire
    en: For the garnish
    # `garnitura` is not standard Italian — the model coins it when asked for an Italian
    # heading, often enough to show up in the measurement. It looks Italian, so the
    # translation pass leaves it alone and it reaches the card. Exactly the case this file
    # is meant to grow for: a real thing got it wrong, so the table learns the word.
    alias: [guarnizione, garnish, to garnish, decorazione, per decorare, garnitura,
            guarnire, per la guarnizione, for garnish]
  impasto:
    it: Per l'impasto
    en: For the dough
    alias: [impasto, dough, batter, pastella]
  ripieno:
    it: Per il ripieno
    en: For the filling
    alias: [ripieno, filling, farcia]
  marinatura:
    it: Per la marinatura
    en: For the marinade
    alias: [marinatura, marinade, marinata]
  verdure:
    it: Verdure
    en: Vegetables
    alias: [le verdure, vegetables, veggies, ortaggi]
  spezie:
    it: Spezie
    en: Spices
    alias: [le spezie, spices]
  secchi:
    it: Ingredienti secchi
    en: Dry ingredients
    alias: [secchi, dry, dry ingredients]
  liquidi:
    it: Ingredienti liquidi
    en: Wet ingredients
    alias: [liquidi, wet, wet ingredients]
  servire:
    it: Per servire
    en: To serve
    alias: [servire, to serve, per accompagnare]
