# ingredients.yaml — the words of a recipe that have a settled translation. A glossary, not
# a dictionary: ingredient names, and the headings they are grouped under.
#
# Why this file exists. Translating an ingredient name is the one step of the pipeline where a
# local model does not merely produce a clumsy sentence but **a different ingredient**. Seen,
# reproducibly, on qwen2.5:14b: `maiale` came back as "bacon" and `cavolo cappuccio` as
# "chinese broccoli". A clumsy translation is legible; a wrong ingredient sends someone to the
# shop for the wrong thing, and nothing on the card says so.
#
# It is the same argument as `densities.yaml`, one axis over. There the model must not guess a
# weight; here it must not guess an identity. Both are facts that belong in a table.
#
# HOW IT IS USED (`extract.translate_draft`):
#
#   whole name in the table   ->  the code translates it. The model never sees the word.
#   part of the name matches  ->  the name goes to the model WITH the known term pinned:
#                                 "Maiale (fettina grassa)" keeps its modifier, and `maiale`
#                                 is not up for discussion.
#   nothing matches           ->  the model translates it, as before.
#
# The third case is not a failure of this file. A glossary that tried to hold every ingredient
# in the world would be wrong more often than it was useful; this one holds what is common in
# the kitchens the tool is aimed at, and grows when something real gets it wrong.
#
# SHAPE. `it` and `en` are the names a cook reads and the ones we write. `alias` are the other
# spellings the material might use — regional names, common English variants, the forms we do
# not emit — in either language, matched case- and accent-insensitively. An alias is never an
# output: it only ever leads to `it`/`en`.
#
# `it_plural`/`en_plural` are optional and exist for the ingredients a recipe counts. "2 uovo"
# and "3 carrot" are the kind of wrong that makes a card look machine-made, and the number is
# right there in `quantity_raw`, so there is no reason to guess: the plural is used when the
# amount is anything other than exactly one. Mass nouns — flour, salt, oil — have no plural
# and need none.
#
# RULE: an alias must be the SAME ingredient, not a similar one. `pancetta` is not `bacon`,
# `cavolo cappuccio` is not `cavolo nero`. That distinction is the whole point of the file, and
# `test_units.py` checks that no alias is claimed by two entries.

