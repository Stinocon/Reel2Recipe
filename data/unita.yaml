# unita.yaml — EXACT conversions between units of measurement.
#
# There are no estimates in here. Every value is an official definition or a standard
# equivalence (US customary → SI). The culinary approximations — "un pizzico", "q.b.",
# "un filo d'olio" — live in `vaghe.yaml` and are labelled as estimates.
#
# The keys of this file are English, the unit names are not: "cucchiaio" and "cucchiaino" are
# the kitchen vocabulary the model produces and the cook reads, exactly like the ingredient
# names in `densita.yaml`. The keys are code, the names are data.
#
# Volume is always brought back to millilitres, weight always to grams. The volume→weight step
# does NOT happen here: it needs the specific ingredient's density and lives in `densita.yaml`.
# With no known density, nothing is converted (see units.py).
#
# updated: 2026-07-23

volume:
  # metric units
  ml: 1.0
  cl: 10.0
  dl: 100.0
  l: 1000.0
  # US customary units (exact definitions)
  cup: 236.5882365
  tbsp: 14.78676478125
  tsp: 4.92892159375
  fl_oz: 29.5735295625
  pint: 473.176473
  quart: 946.352946
  gallon: 3785.411784
  # Italian conventions: the kitchen cucchiaio/cucchiaino is standardised at 15/5 ml. It is
  # not a vague estimate like "un bicchiere", it is the recipe books' conventional measure.
  cucchiaio: 15.0
  cucchiaino: 5.0

weight:
  mg: 0.001
  g: 1.0
  hg: 100.0
  kg: 1000.0
  oz: 28.349523125
  lb: 453.59237

# Volume units that are ALREADY METRIC. For someone cooking in metric they are fine as they
# are: "500 ml di latte" is already an executable measure, converting it to grams makes it
# worse.
metric_volume:
  - ml
  - cl
  - dl
  - l

# Volume units of the Anglo-Saxon system, mirroring the ones above: for someone cooking in
# that system they are already executable and are not to be touched.
imperial_volume:
  - cup
  - tbsp
  - tsp
  - fl_oz
  - pint
  - quart
  - gallon

# Output labels per language: they replace the unit's technical name when a current form
# exists. In Italian "tbsp" is said cucchiaio; in English "cucchiaio" is said tbsp. The table
# is symmetric on purpose — it is the heart of the bidirectionality.
labels:
  it:
    tbsp: cucchiaio
    tsp: cucchiaino
    fl_oz: oncia liquida
    lb: libbra
  en:
    cucchiaio: tbsp
    cucchiaino: tsp
    spicchio: clove
    foglia: leaf
    rametto: sprig
    fetta: slice
    gambo: stalk
    baccello: pod
    barattolo: can
    confezione: pack
    bustina: sachet
    uovo: egg
    pizzico: pinch
    mazzetto: bunch

# Plurals per language, so as to write "2 cucchiai" and not "2 cucchiaio". English is almost
# always regular (+s), but it has to be declared anyway: symbolic units do not pluralise
# ("2 g", not "2 gs"), and guessing would produce exactly that error.
plural:
  it:
    cucchiaio: cucchiai
    cucchiaino: cucchiaini
    spicchio: spicchi
    foglia: foglie
    rametto: rametti
    fetta: fette
    gambo: gambi
    baccello: baccelli
    barattolo: barattoli
    confezione: confezioni
    bustina: bustine
    uovo: uova
    oncia liquida: once liquide
    libbra: libbre
  en:
    cup: cups
    clove: cloves
    leaf: leaves
    sprig: sprigs
    slice: slices
    stalk: stalks
    pod: pods
    can: cans
    pack: packs
    sachet: sachets
    egg: eggs
    pinch: pinches
    bunch: bunches

# Counting units: they are not converted, they are counted. They stay exactly as they are.
count:
  - pz
  - unita
  - spicchio
  - foglia
  - rametto
  - fetta
  - gambo
  - baccello
  - barattolo
  - confezione
  - bustina
  - uovo

# Synonyms and inflected forms → the canonical unit. The comparison happens in lower case,
# without punctuation and without accents (see units._key).
alias:
  # weight
  grammo: g
  grammi: g
  gr: g
  grs: g
  chilo: kg
  chili: kg
  chilogrammo: kg
  chilogrammi: kg
  kgs: kg
  etto: hg
  etti: hg
  ettogrammo: hg
  ettogrammi: hg
  milligrammo: mg
  milligrammi: mg
  oncia: oz
  once: oz
  ounce: oz
  ounces: oz
  libbra: lb
  libbre: lb
  pound: lb
  pounds: lb
  lbs: lb
  # metric volume
  millilitro: ml
  millilitri: ml
  mls: ml
  centilitro: cl
  centilitri: cl
  decilitro: dl
  decilitri: dl
  litro: l
  litri: l
  lt: l
  # US volume
  cups: cup
  tablespoon: tbsp
  tablespoons: tbsp
  tbsps: tbsp
  tbs: tbsp
  teaspoon: tsp
  teaspoons: tsp
  tsps: tsp
  "fl oz": fl_oz
  floz: fl_oz
  fluidounce: fl_oz
  pints: pint
  quarts: quart
  gallons: gallon
  # Italian volume
  cucchiai: cucchiaio
  cucchiaiata: cucchiaio
  cucchiaiate: cucchiaio
  cucchiaini: cucchiaino
  # counting
  pezzo: pz
  pezzi: pz
  unita: pz
  spicchi: spicchio
  foglie: foglia
  rametti: rametto
  fette: fetta
  gambi: gambo
  baccelli: baccello
  barattoli: barattolo
  confezioni: confezione
  bustine: bustina
  uova: uovo

# Units denoting a "by the spoon" measure: if the conversion to weight gives a very small
# value, it is better to keep the original unit (more useful to the cook) and put the weight
# in brackets as a comment. Threshold and behaviour in units.py.
spoon_measures:
  - cucchiaio
  - cucchiaino
  - tbsp
  - tsp

temperature:
  # The formulas are in units.py; here only the recognised synonyms.
  alias:
    c: "°C"
    "°c": "°C"
    celsius: "°C"
    centigradi: "°C"
    f: "°F"
    "°f": "°F"
    fahrenheit: "°F"
  # Ovens are set in steps of 5 °C: rounding to the single degree would give a false
  # precision ("176,7 °C") that no oven can be set to.
  rounding_c: 5
