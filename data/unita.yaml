# unita.yaml — conversioni ESATTE fra unità di misura.
#
# Qui dentro non ci sono stime. Ogni valore è una definizione ufficiale o un'equivalenza
# standard (US customary → SI). Le approssimazioni culinarie — "un pizzico", "q.b.",
# "un filo d'olio" — stanno in `vaghe.yaml` e sono etichettate come stime.
#
# Il volume si riporta sempre a millilitri, il peso sempre a grammi. Il passaggio
# volume→peso NON avviene qui: richiede la densità dello specifico ingrediente e vive
# in `densita.yaml`. Senza densità nota, non si converte (v. units.py).
#
# aggiornato: 2026-07-23

volume:
  # unità metriche
  ml: 1.0
  cl: 10.0
  dl: 100.0
  l: 1000.0
  # unità US customary (definizioni esatte)
  cup: 236.5882365
  tbsp: 14.78676478125
  tsp: 4.92892159375
  fl_oz: 29.5735295625
  pint: 473.176473
  quart: 946.352946
  gallon: 3785.411784
  # convenzioni italiane: il cucchiaio/cucchiaino da cucina è standardizzato a 15/5 ml.
  # Non è una stima vaga come "un bicchiere", è la misura convenzionale dei ricettari.
  cucchiaio: 15.0
  cucchiaino: 5.0

peso:
  mg: 0.001
  g: 1.0
  hg: 100.0
  kg: 1000.0
  oz: 28.349523125
  lb: 453.59237

# Unità di volume GIÀ METRICHE. Per chi cucina col sistema metrico vanno bene così come
# sono: "500 ml di latte" è già una misura eseguibile, convertirla in grammi la peggiora.
volume_metrico:
  - ml
  - cl
  - dl
  - l

# Unità di volume del sistema anglosassone, speculari alle precedenti: per chi cucina in
# quel sistema sono già eseguibili e non vanno toccate.
volume_imperiale:
  - cup
  - tbsp
  - tsp
  - fl_oz
  - pint
  - quart
  - gallon

# Unità di destinazione per ciascun sistema, in ordine di grandezza decrescente. `units.py`
# sceglie la più grande che dia un numero ancora comodo da leggere: 5 ml restano cucchiaini,
# non "0,02 cup".
destinazione:
  metrico:
    peso: [g]
    volume: [ml]
  imperiale:
    peso: [lb, oz]
    volume: [cup, tbsp, tsp]

# Etichette d'uscita per lingua: sostituiscono il nome tecnico dell'unità quando esiste una
# forma corrente. In italiano "tbsp" si dice cucchiaio; in inglese "cucchiaio" si dice tbsp.
# La tabella è simmetrica di proposito — è il cuore della bidirezionalità.
etichette:
  it:
    tbsp: cucchiaio
    tsp: cucchiaino
    fl_oz: oncia liquida
    lb: libbra
  en:
    cucchiaio: tbsp
    cucchiaino: tsp
    spicchio: clove
    foglia: leaf
    rametto: sprig
    fetta: slice
    gambo: stalk
    baccello: pod
    barattolo: can
    confezione: pack
    bustina: sachet
    uovo: egg
    pizzico: pinch
    mazzetto: bunch

# Plurali per lingua, per scrivere "2 cucchiai" e non "2 cucchiaio". L'inglese è quasi
# sempre regolare (+s), ma va dichiarato comunque: le unità simboliche non si pluralizzano
# ("2 g", non "2 gs"), e indovinare produrrebbe proprio quell'errore.
plurale:
  it:
    cucchiaio: cucchiai
    cucchiaino: cucchiaini
    spicchio: spicchi
    foglia: foglie
    rametto: rametti
    fetta: fette
    gambo: gambi
    baccello: baccelli
    barattolo: barattoli
    confezione: confezioni
    bustina: bustine
    uovo: uova
    oncia liquida: once liquide
    libbra: libbre
  en:
    cup: cups
    clove: cloves
    leaf: leaves
    sprig: sprigs
    slice: slices
    stalk: stalks
    pod: pods
    can: cans
    pack: packs
    sachet: sachets
    egg: eggs
    pinch: pinches
    bunch: bunches

# Unità di conteggio: non si convertono, si contano. Restano tali e quali.
conteggio:
  - pz
  - unita
  - spicchio
  - foglia
  - rametto
  - fetta
  - gambo
  - baccello
  - barattolo
  - confezione
  - bustina
  - uovo

# Sinonimi e forme flesse → unità canonica. Il confronto avviene in minuscolo,
# senza punteggiatura e senza accenti (v. units._chiave).
alias:
  # peso
  grammo: g
  grammi: g
  gr: g
  grs: g
  chilo: kg
  chili: kg
  chilogrammo: kg
  chilogrammi: kg
  kgs: kg
  etto: hg
  etti: hg
  ettogrammo: hg
  ettogrammi: hg
  milligrammo: mg
  milligrammi: mg
  oncia: oz
  once: oz
  ounce: oz
  ounces: oz
  libbra: lb
  libbre: lb
  pound: lb
  pounds: lb
  lbs: lb
  # volume metrico
  millilitro: ml
  millilitri: ml
  mls: ml
  centilitro: cl
  centilitri: cl
  decilitro: dl
  decilitri: dl
  litro: l
  litri: l
  lt: l
  # volume US
  cups: cup
  tablespoon: tbsp
  tablespoons: tbsp
  tbsps: tbsp
  tbs: tbsp
  teaspoon: tsp
  teaspoons: tsp
  tsps: tsp
  "fl oz": fl_oz
  floz: fl_oz
  fluidounce: fl_oz
  pints: pint
  quarts: quart
  gallons: gallon
  # volume italiano
  cucchiai: cucchiaio
  cucchiaiata: cucchiaio
  cucchiaiate: cucchiaio
  cucchiaini: cucchiaino
  # conteggio
  pezzo: pz
  pezzi: pz
  unita: pz
  spicchi: spicchio
  foglie: foglia
  rametti: rametto
  fette: fetta
  gambi: gambo
  baccelli: baccello
  barattoli: barattolo
  confezioni: confezione
  bustine: bustina
  uova: uovo

# Unità che indicano una misura "a cucchiaio": se la conversione in peso dà un valore
# molto piccolo, conviene tenere l'unità originale (più utile a chi cucina) e mettere
# il peso fra parentesi come commento. Soglia e comportamento in units.py.
misure_a_cucchiaio:
  - cucchiaio
  - cucchiaino
  - tbsp
  - tsp

temperatura:
  # Le formule sono in units.py; qui solo i sinonimi riconosciuti.
  alias:
    c: "°C"
    "°c": "°C"
    celsius: "°C"
    centigradi: "°C"
    f: "°F"
    "°f": "°F"
    fahrenheit: "°F"
  # I forni si regolano a scatti di 5 °C: arrotondare al grado singolo darebbe
  # una falsa precisione ("176,7 °C") che nessun forno sa impostare.
  arrotondamento_c: 5
