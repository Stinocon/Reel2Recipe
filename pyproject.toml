[project]
name = "reel2recipe"
version = "1.0.0"
description = "Extracts recipes from Instagram Reels (audio + caption) and exports them in Mela format. Entirely local: no online AI, no API key, no cost."
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Conter" }]
dependencies = [
    "pyyaml>=6.0",           # tabelle di conversione in data/
    "httpx>=0.28",           # API HTTP di Ollama (LLM locale) — nessun servizio a pagamento
    "yt-dlp>=2025.1.1",      # acquisizione del reel da URL
]

[project.urls]
Homepage = "https://github.com/Stinocon/Reel2Recipe"
Repository = "https://github.com/Stinocon/Reel2Recipe"

[project.optional-dependencies]
# Trascrizione locale, portabile ovunque (CPU, ctranslate2). È il backend ASR di riferimento.
# Il modello (~1.5 GB per large-v3-turbo) si scarica alla prima esecuzione e resta in cache.
asr = [
    "faster-whisper>=1.1.0",
]
# Acceleratore ASR per Apple Silicon (Metal). Molto più veloce di faster-whisper sui Mac M-series;
# `asr.py` lo usa se presente e ripiega su faster-whisper altrimenti.
asr-mlx = [
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Export in PDF, per chi non usa Mela. Il Markdown non richiede nulla; reportlab è Python
# puro e non tira dentro librerie di sistema, che è ciò che serve per poter girare anche
# dentro un container o su un Raspberry.
doc = [
    "reportlab>=4.2",
]
# Interfaccia web locale (la barra "Cook").
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
r2r = "reel2recipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel2recipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
