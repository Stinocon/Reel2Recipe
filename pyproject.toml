[project]
name = "reel2recipe"
version = "1.1.0"
description = "Extracts recipes from Instagram Reels (audio + caption) and exports them in Mela format. Entirely local: no online AI, no API key, no cost."
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Conter" }]
dependencies = [
    "pyyaml>=6.0",           # tabelle di conversione in data/
    "httpx>=0.28",           # API HTTP di Ollama (LLM locale) — nessun servizio a pagamento
    "yt-dlp>=2025.1.1",      # acquisizione del reel da URL
]

[project.urls]
Homepage = "https://github.com/Stinocon/Reel2Recipe"
Repository = "https://github.com/Stinocon/Reel2Recipe"

[project.optional-dependencies]
# Local transcription, portable everywhere (CPU, ctranslate2). It is the reference ASR backend.
# The model (~1.5 GB for large-v3-turbo) is downloaded on the first run and stays cached.
asr = [
    "faster-whisper>=1.1.0",
]
# ASR accelerator for Apple Silicon (Metal). Much faster than faster-whisper on M-series Macs;
# `asr.py` uses it when present and falls back to faster-whisper otherwise.
asr-mlx = [
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# PDF export, for anyone not using Mela. Markdown needs nothing; reportlab is pure Python and
# does not drag in system libraries, which is what makes it able to run inside a container or
# on a Raspberry Pi too.
doc = [
    "reportlab>=4.2",
]
# The local web interface (the "Cook" bar).
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
r2r = "reel2recipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel2recipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
